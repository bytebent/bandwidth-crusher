name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the "latest" download

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (C++ vs Python reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: g++ -O2 -std=c++17 -o dsp_cli tests/dsp_cli.cpp
      - run: python tests/compare.py ./dsp_cli

  macos:
    name: macOS plugin (AU + VST3, universal)
    runs-on: macos-14
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target BandwidthCrusher_AU BandwidthCrusher_VST3 BandwidthCrusher_Standalone -j 4

      - name: Sign (ad-hoc, so macOS will load it)
        run: |
          ART="build/BandwidthCrusher_artefacts/Release"
          for b in "$ART/AU/Bandwidth Crusher.component" "$ART/VST3/Bandwidth Crusher.vst3" "$ART/Standalone/Bandwidth Crusher.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done
          lipo -info "$ART/VST3/Bandwidth Crusher.vst3/Contents/MacOS/Bandwidth Crusher"

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/BandwidthCrusher_artefacts/Release/AU/Bandwidth Crusher.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx Bwcr Bytb

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 7 --validate-in-process --timeout-ms 300000 \
            "build/BandwidthCrusher_artefacts/Release/VST3/Bandwidth Crusher.vst3"

      - name: Package
        run: |
          ART="build/BandwidthCrusher_artefacts/Release"
          PKG="Bandwidth Crusher"
          mkdir -p "dist/$PKG"
          cp -R "$ART/AU/Bandwidth Crusher.component" "$ART/VST3/Bandwidth Crusher.vst3" "$ART/Standalone/Bandwidth Crusher.app" "dist/$PKG/"
          cp packaging/Install.command packaging/INSTALL.txt "dist/$PKG/"
          chmod +x "dist/$PKG/Install.command"
          cd dist && ditto -c -k --keepParent "$PKG" BandwidthCrusher-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BandwidthCrusher-macOS
          path: dist/BandwidthCrusher-macOS.zip

      - name: Publish as the "latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/BandwidthCrusher-macOS.zip --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download BandwidthCrusher-macOS.zip, unzip it, and follow INSTALL.txt."
